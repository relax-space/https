<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>我的页面</title>
    <style>
      body {
        display: flex;
        justify-content: center; /* 水平居中 */
        align-items: flex-start; /* 垂直靠上 */
        height: 100vh; /* 视口高度 */
        margin: 0; /* 去掉默认边距 */
        background-color: #f0f0f0; /* 背景颜色 */
        font-family: "Arial", sans-serif; /* 字体 */
      }

      .content {
        text-align: center; /* 文本居中 */
        padding: 20px; /* 内边距 */
        background-color: #fff; /* 内容背景颜色 */
        border-radius: 10px; /* 圆角 */
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1); /* 阴影效果 */
        font-size: 24px; /* 字体大小 */
        color: #333; /* 字体颜色 */
        margin-top: 100px; /* 调整距离顶部的间距，可根据需要修改 */
      }

      .highlight {
        color: #e74c3c; /* 突出显示的颜色 */
        font-weight: bold; /* 加粗 */
      }
    </style>
  </head>
  <body>
    <div class="content">
      <p>
        我搬起砖无法拥抱你，<span class="highlight">我拥抱你却无法养活你</span>
      </p>
    </div>
  </body>
</html>
