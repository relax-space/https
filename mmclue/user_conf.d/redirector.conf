server {
    # Listen on plain old HTTP and catch all requests so they can be redirected
    # to HTTPS instead.
    listen 80 default_server reuseport;
    listen [::]:80 default_server reuseport;

    if ($request_method = CONNECT) {
        return 444;
    }
    # Anything requesting this particular URL should be served content from
    # Certbot's folder so the HTTP-01 ACME challenges can be completed for the
    # HTTPS certificates.
    location /.well-known/acme-challenge {
        default_type "text/plain";
        root /var/www/letsencrypt;
    }


    # 除了acme-challenge以外，所有HTTP请求全部拒绝访问
    location / {
        access_log off;
        return 444;
    }
    #     # 阻挡常见扫描路径
    #     location ~* /(wordpress|wp-admin|wp-login\.php|xmlrpc\.php|phpmyadmin|config\.php|setup\.php|shell\.php|vendor/phpunit|cgi-bin|backup\.zip|admin\.php|upload\.php|readme\.html|install\.php|phpinfo\.php|robots\.txt|sitemap\.xml|config\.json|wlwmanifest\.xml) {
    #         access_log off;
    #         log_not_found off;
    #         return 403;
    #     }
    #     # 禁止访问隐藏文件和目录（如 .git）
    #     location ~ /\. {
    #         deny all;
    #     }
    #     # 防止访问备份文件等
    #     location ~* \.(bak|config|sql|fla|psd|ini|log|sh|inc|swp|dist)$ {
    #         deny all;
