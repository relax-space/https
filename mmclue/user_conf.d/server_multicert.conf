map $request_uri $bad_uri {
    default 0;
    ~[\x00-\x08\x0B\x0C\x0E-\x1F\x7F-\xFF] 1;
}

map $http_user_agent $bad_ua {
    "" 1;
    default 0;
}

server {
    listen 443 ssl default_server reuseport;
    listen [::]:443 ssl default_server reuseport;

    server_name mmclue.com www.mmclue.com;

    # 如果不是 mmclue.com 或其子域名，直接返回 444
    if ($host !~* ^(.*\.)?mmclue\.com$) {
        return 444;
    }

    # SSL 证书
    ssl_certificate /etc/letsencrypt/live/aliyun-ecc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aliyun-ecc/privkey.pem;

    ssl_certificate /etc/letsencrypt/live/aliyun-rsa/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aliyun-rsa/privkey.pem;

    ssl_dhparam /etc/letsencrypt/dhparams/dhparam.pem;
    ssl_ecdh_curve X25519:prime256v1;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "EECDH+ECDSA+AESGCM:EECDH+aRSA+AESGCM:EECDH+ECDSA+SHA384:EECDH+ECDSA+SHA256:EECDH+aRSA+SHA384:EECDH+aRSA+SHA256:EECDH:DHE+AESGCM:DHE:!RSA!aNULL:!eNULL:!LOW:!RC4:!3DES:!MD5:!EXP:!PSK:!SRP:!DSS:!CAMELLIA:!SEED";


    # 请求方法限制，放最前面
    if ($request_method = CONNECT) {
        return 444;
    }

    if ($request_method !~ ^(GET|POST|HEAD|PUT|DELETE|OPTIONS|PATCH)$) {
        return 444;
    }

    # 请求URI非法字符过滤
    if ($request_uri ~* "[\x00-\x08\x0B\x0C\x0E-\x1F\x7F-\xFF]") {
        return 444;
    }

    # User-Agent为空拒绝
    if ($http_user_agent = "") {
        return 444;
    }

    # 敏感目录防护，放在前面，具体优先匹配
    location ~* ^/(ecp|geoserver|webui|locales|wordpress|wp-admin|phpmyadmin|vendor/phpunit|cgi-bin) {
        access_log off;
        return 444;
    }

    location ~* ^/(security|sitecore|owa|version|ads|app-ads|sellers|SSH-2.0-Go|WuEL|a|manager|login|dns-query|server-status|js|wiki|epa|pscc|start|metrics|ReportServer) {
        access_log off;
        return 444;
    }

    location ~* /(autodiscover|_profiler|developmentserver|SiteLoader|mPlayer|download|stager64) {
        access_log off;
        return 444;
    }

    # 敏感文件防护
    location ~* ^/(wp-login\.php|xmlrpc\.php|config\.php|setup\.php|shell\.php|backup\.zip|admin\.php|upload\.php|readme\.html|install\.php|phpinfo\.php|robots\.txt|sitemap\.xml|config\.json|wlwmanifest\.xml)$ {
        access_log off;
        return 444;
    }

    # 特定关键词过滤
    location ~* (mining\.subscribe|AMQP|SMB|mongo) {
        access_log off;
        return 444;
    }

    # 备份文件后缀过滤
    location ~* \.(bak|config|sql|fla|psd|ini|log|sh|inc|swp|dist)$ {
        access_log off;
        return 444;
    }


    # 禁止访问所有隐藏文件和目录（以 . 开头）
    location ~ /\. {
        access_log off;
        return 444;
    }

    # favicon 特殊处理
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        try_files /favicon.ico =204;
    }

    # 限制请求体大小
    client_max_body_size 1M;

    # 默认根目录响应
    location / {
        limit_except GET POST HEAD PUT DELETE OPTIONS PATCH {
            deny all; # 拒绝其他方法的请求
            access_log off; # 禁止写入日志
        }

        # 请求URI非法字符过滤
        if ($bad_uri) {
            return 444;
        }

        # User-Agent为空拒绝
        if ($bad_ua) {
            return 444;
        }
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ =404;
    }
}
